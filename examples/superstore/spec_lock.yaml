# Superstore (dataset público): estrella derivada de un fichero plano, 4 páginas. Confirmado en el gate.
version: 1
project: Superstore
locale: es-ES

sources:
  - id: pedidos_xlsx
    type: excel
    path: sources/superstore.xlsx   # hoja Pedidos: 9.994 líneas de pedido, 2015-2018

model:
  date_table:
    name: Fechas
    start: 2015-01-01
    end: 2018-12-31

  relationships:
    - { from: "Pedidos[Fecha Pedido]", to: "Fechas[Fecha]" }
    - { from: "Pedidos[ClienteId]", to: "Clientes[ClienteId]" }
    - { from: "Pedidos[ProductoId]", to: "Productos[ProductoId]" }

  tables:
    - name: Pedidos
      description: Líneas de pedido (un producto dentro de un pedido). La geografía es la del destino del pedido.
      source: { source: pedidos_xlsx, sheet: Pedidos }
      columns:
        - { name: Línea, source_column: Row ID, type: int64, hidden: true }
        - { name: Pedido, source_column: Order ID, type: string, hidden: true }
        - { name: Fecha Pedido, source_column: Order Date, type: dateTime, format: "dd/MM/yyyy" }
        - { name: Fecha Envío, source_column: Ship Date, type: dateTime, format: "dd/MM/yyyy" }
        - { name: Modo Envío, source_column: Ship Mode, type: string, description: Servicio de transporte contratado }
        - { name: ClienteId, source_column: Customer ID, type: string, hidden: true }
        - { name: ProductoId, source_column: Product ID, type: string, hidden: true }
        - { name: Región, source_column: Region, type: string, description: Región de destino del pedido }
        - { name: Estado, source_column: State, type: string, description: Estado de destino del pedido }
        - { name: Ciudad, source_column: City, type: string }
        - { name: Venta Línea, source_column: Sales, type: double, summarize: sum, format: "$#,##0.00", description: Importe de la línea con descuento aplicado }
        - { name: Cantidad Línea, source_column: Quantity, type: int64, summarize: sum, format: "#,##0" }
        - { name: Descuento, source_column: Discount, type: double, format: "0%", description: Descuento aplicado a la línea }
        - { name: Beneficio Línea, source_column: Profit, type: double, summarize: sum, format: "$#,##0.00" }
      measures:
        - { name: Ventas, dax: "SUM(Pedidos[Venta Línea])", format: "$#,##0", description: Importe facturado con descuento aplicado, folder: Ventas }
        - { name: Beneficio, dax: "SUM(Pedidos[Beneficio Línea])", format: "$#,##0", description: Beneficio por línea; puede ser negativo, folder: Rentabilidad }
        - { name: Margen %, dax: "DIVIDE([Beneficio], [Ventas])", format: "0.0%", description: Beneficio sobre ventas, folder: Rentabilidad }
        - { name: Cantidad, dax: "SUM(Pedidos[Cantidad Línea])", format: "#,##0", description: Unidades vendidas, folder: Ventas }
        - { name: Nº Pedidos, dax: "DISTINCTCOUNT(Pedidos[Pedido])", format: "#,##0", description: Número de pedidos distintos (un pedido tiene varias líneas), folder: Pedidos }
        - { name: Ticket Medio por Pedido, dax: "DIVIDE([Ventas], [Nº Pedidos])", format: "$#,##0.00", description: Ventas por pedido, folder: Pedidos }
        - { name: Descuento Medio, dax: "AVERAGE(Pedidos[Descuento])", format: "0.0%", description: Descuento medio por línea de pedido, folder: Rentabilidad }
        - { name: Clientes Activos, dax: "DISTINCTCOUNT(Pedidos[ClienteId])", format: "#,##0", description: Clientes con al menos un pedido en el contexto, folder: Pedidos }
        - { name: Ventas YTD, dax: "TOTALYTD([Ventas], Fechas[Fecha])", format: "$#,##0", description: Ventas acumuladas del año en curso, folder: Tiempo }
        - { name: Ventas PY, dax: "CALCULATE([Ventas], SAMEPERIODLASTYEAR(Fechas[Fecha]))", format: "$#,##0", description: Ventas del mismo periodo del año anterior, folder: Tiempo }
        - { name: Var % Ventas vs PY, dax: "DIVIDE([Ventas] - [Ventas PY], [Ventas PY])", format: "0.0%", description: Variación de ventas frente al mismo periodo del año anterior, folder: Tiempo }
        - { name: Beneficio PY, dax: "CALCULATE([Beneficio], SAMEPERIODLASTYEAR(Fechas[Fecha]))", format: "$#,##0", description: Beneficio del mismo periodo del año anterior, folder: Tiempo }
        - { name: Ventas Último Año, dax: "CALCULATE([Ventas], Fechas[Año] = MAX(Fechas[Año]))", format: "$#,##0", description: Ventas del último año con datos en el contexto, folder: Tiempo }
        - { name: Ventas Año Previo, dax: "CALCULATE([Ventas], Fechas[Año] = MAX(Fechas[Año]) - 1)", format: "$#,##0", description: Ventas del año anterior al último con datos, folder: Tiempo }
        - { name: Crecimiento Anual %, dax: "DIVIDE([Ventas Último Año] - [Ventas Año Previo], [Ventas Año Previo])", format: "0.0%", description: Último año frente al anterior; válido sin filtro temporal, folder: Tiempo }
        - { name: Plazo Medio Envío, dax: "AVERAGEX(Pedidos, DATEDIFF(Pedidos[Fecha Pedido], Pedidos[Fecha Envío], DAY))", format: "#,##0.0", description: Días medios entre la fecha de pedido y la de envío, folder: Operaciones }

    - name: Clientes
      description: Una fila por cliente, derivada del fichero de pedidos
      source: { source: pedidos_xlsx, sheet: Pedidos, distinct_key: Customer ID, attributes: [Customer Name, Segment] }
      columns:
        - { name: ClienteId, source_column: Customer ID, type: string, hidden: true }
        - { name: Cliente, source_column: Customer Name, type: string, description: Nombre del cliente }
        - { name: Segmento, source_column: Segment, type: string, description: Segmento comercial del cliente }

    - name: Productos
      description: Una fila por producto, derivada del fichero de pedidos. 32 ids traen varios nombres; se conserva el primero
      source: { source: pedidos_xlsx, sheet: Pedidos, distinct_key: Product ID, attributes: [Product Name, Category, Sub-Category] }
      columns:
        - { name: ProductoId, source_column: Product ID, type: string, hidden: true }
        - { name: Producto, source_column: Product Name, type: string, description: Nombre del producto }
        - { name: Categoría, source_column: Category, type: string, description: Categoría del producto }
        - { name: Subcategoría, source_column: Sub-Category, type: string, description: Subcategoría del producto }

report:
  theme: { brand: demo }
  pages:
    - name: Resumen
      visuals:
        - { type: textbox, name: titulo, text: "Resumen de ventas y rentabilidad", font_size_pt: 20, grid: { col: 0, row: 0, cols: 8, rows: 2 } }
        - { type: slicer, name: f_anio, field: "Fechas[Año]", mode: dropdown, title: Año, grid: { col: 8, row: 0, cols: 2, rows: 2 } }
        - { type: slicer, name: f_region, field: "Pedidos[Región]", mode: dropdown, title: Región, grid: { col: 10, row: 0, cols: 2, rows: 2 } }
        - { type: card, name: kpi_ventas, measure: "Pedidos[Ventas]", title: Ventas, accent: primary, grid: { col: 0, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_beneficio, measure: "Pedidos[Beneficio]", title: Beneficio, accent: positive, grid: { col: 3, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_margen, measure: "Pedidos[Margen %]", title: Margen, accent: secondary, grid: { col: 6, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_pedidos, measure: "Pedidos[Nº Pedidos]", title: Pedidos, accent: neutral, grid: { col: 9, row: 2, cols: 3, rows: 2 } }
        # 16 trimestres: con eje, sin etiquetas de datos (se apinarian)
        - { type: line, name: tendencia, title: Ventas por trimestre frente al año anterior, category: "Fechas[AñoTrimestre]", values: ["Pedidos[Ventas]", "Pedidos[Ventas PY]"], grid: { col: 0, row: 4, cols: 8, rows: 4 } }
        # 4 barras: el valor junto a la barra y sin eje, que no aporta nada
        - { type: bar, name: por_region, title: Ventas por región, category: "Pedidos[Región]", values: ["Pedidos[Ventas]"], data_labels: true, accent: primary, grid: { col: 8, row: 4, cols: 4, rows: 4 } }
        - { type: column, name: beneficio_categoria, title: Beneficio por categoría, category: "Productos[Categoría]", values: ["Pedidos[Beneficio]"], data_labels: true, accent: positive, grid: { col: 0, row: 8, cols: 6, rows: 4 } }
        - { type: column, name: beneficio_segmento, title: Beneficio por segmento de cliente, category: "Clientes[Segmento]", values: ["Pedidos[Beneficio]"], data_labels: true, accent: positive, grid: { col: 6, row: 8, cols: 6, rows: 4 } }

    - name: Rentabilidad
      visuals:
        - { type: textbox, name: titulo, text: "Rentabilidad por producto y descuento", font_size_pt: 20, grid: { col: 0, row: 0, cols: 8, rows: 2 } }
        - { type: slicer, name: f_anio, field: "Fechas[Año]", mode: dropdown, title: Año, grid: { col: 8, row: 0, cols: 2, rows: 2 } }
        - { type: slicer, name: f_categoria, field: "Productos[Categoría]", mode: dropdown, title: Categoría, grid: { col: 10, row: 0, cols: 2, rows: 2 } }
        - { type: card, name: kpi_margen, measure: "Pedidos[Margen %]", title: Margen, accent: secondary, grid: { col: 0, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_descuento, measure: "Pedidos[Descuento Medio]", title: Descuento medio, accent: warning, grid: { col: 3, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_beneficio, measure: "Pedidos[Beneficio]", title: Beneficio, accent: positive, grid: { col: 6, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_ventas, measure: "Pedidos[Ventas]", title: Ventas, accent: primary, grid: { col: 9, row: 2, cols: 3, rows: 2 } }
        # 17 subcategorías: el máximo que admite una barra, y solo ocupando toda la altura. Ascendente: las pérdidas arriba
        - { type: bar, name: beneficio_subcategoria, title: Beneficio por subcategoría, category: "Productos[Subcategoría]", values: ["Pedidos[Beneficio]"], sort_direction: asc, accent: positive, grid: { col: 0, row: 4, cols: 6, rows: 8 } }
        - { type: column, name: beneficio_descuento, title: Beneficio según el descuento aplicado, category: "Pedidos[Descuento]", values: ["Pedidos[Beneficio]"], sort: category, accent: warning, grid: { col: 6, row: 4, cols: 6, rows: 4 } }
        - { type: matrix, name: tabla, title: Ventas y margen por categoría, rows: ["Productos[Categoría]", "Productos[Subcategoría]"], values: ["Pedidos[Ventas]", "Pedidos[Beneficio]", "Pedidos[Margen %]", "Pedidos[Descuento Medio]"], grid: { col: 6, row: 8, cols: 6, rows: 4 } }

    - name: Clientes
      visuals:
        - { type: textbox, name: titulo, text: "Clientes y segmentos", font_size_pt: 20, grid: { col: 0, row: 0, cols: 8, rows: 2 } }
        - { type: slicer, name: f_anio, field: "Fechas[Año]", mode: dropdown, title: Año, grid: { col: 8, row: 0, cols: 2, rows: 2 } }
        - { type: slicer, name: f_segmento, field: "Clientes[Segmento]", mode: dropdown, title: Segmento, grid: { col: 10, row: 0, cols: 2, rows: 2 } }
        - { type: card, name: kpi_clientes, measure: "Pedidos[Clientes Activos]", title: Clientes activos, accent: secondary, grid: { col: 0, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_ticket, measure: "Pedidos[Ticket Medio por Pedido]", title: Ticket medio por pedido, accent: neutral, grid: { col: 3, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_pedidos, measure: "Pedidos[Nº Pedidos]", title: Pedidos, accent: neutral, grid: { col: 6, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_ventas, measure: "Pedidos[Ventas]", title: Ventas, accent: primary, grid: { col: 9, row: 2, cols: 3, rows: 2 } }
        - { type: bar, name: ventas_segmento, title: Ventas por segmento, category: "Clientes[Segmento]", values: ["Pedidos[Ventas]"], data_labels: true, accent: primary, grid: { col: 0, row: 4, cols: 4, rows: 4 } }
        - { type: column, name: pedidos_mes, title: Pedidos por mes y año, category: "Fechas[Mes]", series: "Fechas[Año]", values: ["Pedidos[Nº Pedidos]"], grid: { col: 4, row: 4, cols: 8, rows: 4 } }
        # 793 clientes no caben en un gráfico: el detalle por cliente se lee en la matriz
        - { type: matrix, name: tabla, title: Ventas y margen por cliente, rows: ["Clientes[Segmento]", "Clientes[Cliente]"], values: ["Pedidos[Ventas]", "Pedidos[Nº Pedidos]", "Pedidos[Beneficio]", "Pedidos[Margen %]"], grid: { col: 0, row: 8, cols: 6, rows: 4 } }
        - { type: bar, name: clientes_region, title: Clientes activos por región, category: "Pedidos[Región]", values: ["Pedidos[Clientes Activos]"], data_labels: true, accent: secondary, grid: { col: 6, row: 8, cols: 6, rows: 4 } }

    - name: Operaciones
      visuals:
        - { type: textbox, name: titulo, text: "Operaciones y plazos de envío", font_size_pt: 20, grid: { col: 0, row: 0, cols: 8, rows: 2 } }
        - { type: slicer, name: f_anio, field: "Fechas[Año]", mode: dropdown, title: Año, grid: { col: 8, row: 0, cols: 2, rows: 2 } }
        - { type: slicer, name: f_region, field: "Pedidos[Región]", mode: dropdown, title: Región, grid: { col: 10, row: 0, cols: 2, rows: 2 } }
        - { type: card, name: kpi_plazo, measure: "Pedidos[Plazo Medio Envío]", title: Plazo medio de envío (días), accent: warning, grid: { col: 0, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_pedidos, measure: "Pedidos[Nº Pedidos]", title: Pedidos, accent: neutral, grid: { col: 3, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_cantidad, measure: "Pedidos[Cantidad]", title: Unidades, accent: neutral, grid: { col: 6, row: 2, cols: 3, rows: 2 } }
        - { type: card, name: kpi_ventas, measure: "Pedidos[Ventas]", title: Ventas, accent: primary, grid: { col: 9, row: 2, cols: 3, rows: 2 } }
        - { type: column, name: pedidos_modo, title: Pedidos por modo de envío, category: "Pedidos[Modo Envío]", values: ["Pedidos[Nº Pedidos]"], data_labels: true, accent: primary, grid: { col: 0, row: 4, cols: 6, rows: 4 } }
        - { type: bar, name: plazo_modo, title: Plazo medio de envío por modo (días), category: "Pedidos[Modo Envío]", values: ["Pedidos[Plazo Medio Envío]"], data_labels: true, accent: warning, grid: { col: 6, row: 4, cols: 6, rows: 4 } }
        # Los 49 estados se leen en la matriz con drill desde la región; un ranking de 49 barras sería scroll puro
        - { type: matrix, name: tabla, title: Servicio por región y estado, rows: ["Pedidos[Región]", "Pedidos[Estado]"], values: ["Pedidos[Nº Pedidos]", "Pedidos[Ventas]", "Pedidos[Plazo Medio Envío]"], grid: { col: 0, row: 8, cols: 5, rows: 4 } }
        - { type: bar, name: plazo_region, title: Plazo medio de envío por región (días), category: "Pedidos[Región]", values: ["Pedidos[Plazo Medio Envío]"], data_labels: true, accent: warning, grid: { col: 5, row: 8, cols: 7, rows: 4 } }
